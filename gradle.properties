# Gradle / JVM memory limits for modest development environments.
org.gradle.jvmargs=-Xmx384m -XX:ActiveProcessorCount=2
org.gradle.daemon=false
org.gradle.workers.max=1

# Build tool versions
minecraft_version=26.1.2
neoforge_version=26.1.2.120

group=dev.compat.hephaestus

# Values expanded into META-INF/neoforge.mods.toml
MODID=hephaestus_bettercombat_compat
VERSION=1.0.1
NAME=Hephaestus Better Combat Compatibility
AUTHOR=Hephaestus Better Combat Compatibility contributors
DESCRIPTION=Better Combat weapon attributes for Hephaestus Tools on NeoForge 26.1.2.
GIT_REPO=https://github.com/smyly9/hephaestus-bettercombat-compat
NEO_FORGE_LOADER=[4,)
NEOFORGE_VERSION_RANGE=[26.1.2.120,)
MINECRAFT=26.1.2
ITEM_ICON=minecraft:iron_sword
