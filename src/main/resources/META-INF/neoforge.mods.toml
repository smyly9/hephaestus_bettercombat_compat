modLoader = "javafml"
loaderVersion = "${NEO_FORGE_LOADER}"
issueTrackerURL = "${GIT_REPO}/issues"
license = "MIT"

[[mods]]
modId = "${MODID}"
version = "${VERSION}"
displayName = "${NAME}"
authors = "${AUTHOR}"
iconFile = "icon.png"
logoFile = "icon.png"
description = '''${DESCRIPTION}'''
itemIcon = "${ITEM_ICON}"

[[dependencies.${MODID}]]
modId = "neoforge"
type = "required"
versionRange = "${NEOFORGE_VERSION_RANGE}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${MODID}]]
modId = "minecraft"
type = "required"
versionRange = "[${MINECRAFT}]"
ordering = "NONE"
side = "BOTH"

[[dependencies.${MODID}]]
modId = "bettercombat"
type = "required"
versionRange = "[3.2.2,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${MODID}]]
modId = "hephaestus_tools"
type = "required"
versionRange = "[1.0.0,)"
ordering = "AFTER"
side = "BOTH"
