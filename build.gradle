plugins {
    id 'net.neoforged.moddev' version '2.0.141'
}

group = project.property('group')
version = project.property('VERSION')

base {
    archivesName = project.property('MODID')
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

neoForge {
    enable {
        version = neoforge_version
        // Resource-only mod: skip Minecraft source decompilation/recompilation.
        disableRecompilation = true
    }

    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
    }

    mods {
        "${project.property('MODID')}" {
            sourceSet(sourceSets.main)
        }
    }
}

processResources {
    def metadata = [
        MODID: project.property('MODID'),
        VERSION: project.property('VERSION'),
        NAME: project.property('NAME'),
        AUTHOR: project.property('AUTHOR'),
        DESCRIPTION: project.property('DESCRIPTION'),
        GIT_REPO: project.property('GIT_REPO'),
        NEO_FORGE_LOADER: project.property('NEO_FORGE_LOADER'),
        NEOFORGE_VERSION_RANGE: project.property('NEOFORGE_VERSION_RANGE'),
        MINECRAFT: project.property('MINECRAFT'),
        ITEM_ICON: project.property('ITEM_ICON')
    ]
    filesMatching('META-INF/neoforge.mods.toml') {
        expand(metadata)
    }
}
